name: ruff-pytest

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    environment: 
      name: default
    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      uses: astral-sh/setup-uv@v10.0.1
      with:
        enable-cache: true

    - name: Install the project
      run: uv sync --locked --all-extras --dev

    - name: Analyzing the code with ruff
      run: |
        uv run ruff check --fix src/
    - name: Run pytest
      run: |
        uv run pytest tests/