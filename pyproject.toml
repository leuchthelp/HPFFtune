[project]
name = "hpfftune"
version = "0.1.0"
description = "Optimal parameter search for HPC file format applications."
readme = "README.md"
authors = [
    { name = "leuchthelp", email = "gfpinthehouse@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "dask>=2026.8.0",
    "hpffbench",
    "matplot>=0.1.9",
    "rich>=15.0.0",
    "rich-argparse>=1.8.0",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "torch>=2.13.0",
    "xarray>=2026.7.0",
]

[project.scripts]
hpfftune = "hpfftune:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
hpffbench = { git = "https://github.com/leuchthelp/HPFFbench.git" }

[dependency-groups]
dev = [
    "mkdocstrings-python>=2.0.7",
    "nbstripout>=0.9.1",
    "pytest>=9.1.1",
    "ruff>=0.16.4",
    "ty>=0.0.74",
    "zensical>=0.0.57",
]
